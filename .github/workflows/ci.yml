name: Trading Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Syntax & Compilation Validation
        run: |
          python -m compileall core services strategies tests scripts

      - name: Strategy Contract Verification
        run: |
          python -c "from strategies.base import BaseStrategy, StrategyMetadata; from core.risk.engine import RiskEngine; print('Strategy Contract & Risk Engine Verified')"

      - name: Run Test Suite (117 Tests)
        env:
          PYTHONPATH: .
          MT5_OFFLINE_MODE: "1"
          LOG_LEVEL: ERROR
        run: |
          pytest tests/ -v --tb=short

      - name: Alert CI Failure to Telegram & Discord
        if: failure() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          python scripts/notify_bots.py \
            --event ci-failure \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }} (Python ${{ matrix.python-version }})" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --actor "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
