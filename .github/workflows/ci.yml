name: Trading Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Syntax & Compilation Validation
        run: |
          python -m compileall core services strategies tests bot.py

      - name: Strategy Contract Verification
        run: |
          python -c "from strategies.base import BaseStrategy, StrategyMetadata; from core.risk.engine import RiskEngine; print('Strategy Contract & Risk Engine Verified')"

      - name: Run Test Suite (69 Tests)
        env:
          PYTHONPATH: .
          LOG_LEVEL: ERROR
        run: |
          pytest tests/ -v --tb=short
